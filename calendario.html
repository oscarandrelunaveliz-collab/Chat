<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Tareas</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="Logo agenda-Photoroom.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Estilos del Calendario -->
  <link rel="stylesheet" href="calendario.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

  <!-- Encabezado con Navegación -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-all">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">Calendario escolar</h1>
          <p class="text-xs text-slate-400 font-medium">Revisión de entregas por fecha</p>
        </div>
      </div>
      <a href="index.html" class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 hover:bg-indigo-600/30 transition-all">
        <i data-lucide="list-todo" class="w-4 h-4"></i>
        <span>Lista</span>
      </a>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- Control de Mes y Año -->
    <section class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <button id="prev-month" class="p-2 rounded-xl bg-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-700 transition-all">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <h2 id="month-year-label" class="text-base font-bold text-white capitalize tracking-wide">
          <!-- Carga dinámicamente -->
        </h2>
        <button id="next-month" class="p-2 rounded-xl bg-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-700 transition-all">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Cabecera Días de la Semana -->
      <div class="grid grid-cols-7 text-center text-[11px] font-bold text-slate-500 uppercase tracking-wider">
        <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
      </div>

      <!-- Rejilla de Días -->
      <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 text-center">
        <!-- Renderizado dinámico de días -->
      </div>
    </section>

    <!-- Resumen del Día Seleccionado -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h3 id="selected-date-title" class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="calendar-days" class="w-4 h-4 text-indigo-400"></i>
          <span>Selecciona un día</span>
        </h3>
        <span id="pending-count-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-400 border border-slate-700">
          0 pendientes
        </span>
      </div>

      <!-- Lista de Tareas del Día Seleccionado -->
      <div id="day-tasks-container" class="space-y-3">
        <!-- Tareas dinámicas -->
      </div>
    </section>

  </main>

  <script src="calendario.js"></script>
</body>
</html>
