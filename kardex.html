<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kárdex de Estudiantes</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="Logo agenda-Photoroom.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="kardex.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

  <!-- Encabezado -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-all">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">Kárdex de Observaciones</h1>
          <p class="text-xs text-slate-400 font-medium">Registro de faltas e incumplimientos</p>
        </div>
      </div>
      <button id="open-record-modal" class="bg-rose-600 hover:bg-rose-500 text-white p-2.5 rounded-2xl shadow-lg shadow-rose-600/30 transition-all flex items-center gap-1.5 text-xs font-semibold active:scale-95">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>Anotar</span>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Buscador de Estudiantes -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
      <input type="text" id="search-student" placeholder="Buscar por apellido o nombre..." class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-rose-500/80 transition-all">
    </div>

    <!-- Lista de Estudiantes con sus Observaciones -->
    <div id="students-container" class="space-y-3">
      <!-- Carga dinámica mediante JS -->
    </div>

  </main>

  <!-- Modal para Registrar Observación -->
  <div id="record-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl border border-slate-800 p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="user-x" class="w-5 h-5 text-rose-400"></i>
          <h3 class="font-bold text-base text-white">Registrar Falta u Observación</h3>
        </div>
        <button id="close-record-modal" type="button" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-all">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="kardex-form" class="space-y-3">
        <!-- Selector de Estudiante -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Estudiante</label>
          <select id="student-select" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-rose-500">
            <option value="" disabled selected>Selecciona un estudiante...</option>
            <!-- Lista inyectada por JS -->
          </select>
        </div>

        <!-- Selector de Materia -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Materia</label>
          <select id="kardex-subject" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-rose-500">
            <option value="Matemáticas">Matemáticas</option>
            <option value="Historia">Historia</option>
            <option value="Física">Física</option>
            <option value="Química">Química</option>
            <option value="Lenguaje">Lenguaje</option>
            <option value="Inglés">Inglés</option>
          </select>
        </div>

        <!-- Tipo de Incidencia -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tipo de Observación</label>
          <select id="kardex-type" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-rose-500">
            <option value="No entregó tarea">No entregó tarea ❌</option>
            <option value="Tarea incompleta">Tarea incompleta ⚠️</option>
            <option value="Falta a clase">Falta a clase 🚫</option>
            <option value="Atraso">Atraso ⏱️</option>
          </select>
        </div>

        <!-- Detalle o Nota -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Detalle / Comentario</label>
          <textarea id="kardex-detail" rows="2" placeholder="Ej. No presentó la práctica #2..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-rose-500 resize-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-rose-600/30 transition-all text-xs mt-2 active:scale-95">
          Guardar Registro
        </button>
      </form>
    </div>
  </div>

  <script src="kardex.js"></script>
</body>
</html>
